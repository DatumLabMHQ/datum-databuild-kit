version: 2
sources:
  - name: {{schema}}_raw
    schema: {{schema}}
    description: Hourly snapshots for {{title}} from {{url}} ({{adapter}}).
    tables:
      - name: raw_snapshots
        loaded_at_field: fetched_at
        freshness: {warn_after: {count: 3, period: hour}, error_after: {count: 12, period: hour}}
